openapi: 3.0.3
info:
  title: EduSmart Product API
  version: 1.0.0
  description: Product API dengan JWT Authentication (register, login, dan CRUD produk).
servers:
  - url: http://localhost:3000/api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Modul Kurikulum Merdeka }
        description: { type: string, nullable: true, example: Modul ajar SD }
        price: { type: string, example: "75000.00" }
        stock: { type: integer, example: 20 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, example: Modul Kurikulum Merdeka }
        description: { type: string, example: Modul ajar SD }
        price: { type: number, minimum: 0, example: 75000 }
        stock: { type: integer, minimum: 0, example: 20 }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
    ValidationError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Validasi gagal }
        errors:
          type: array
          items: { type: string }
          example: ["name wajib diisi dan berupa teks", "price wajib diisi dan berupa angka >= 0"]
  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, message: Akses ditolak, token tidak ditemukan }
    NotFound:
      description: Produk tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, message: Produk tidak ditemukan }
    BadRequest:
      description: Validasi input gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: ID produk

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrasi user baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Candra Test }
                email: { type: string, example: candra@test.com }
                password: { type: string, minLength: 6, example: rahasia123 }
      responses:
        '201':
          description: Registrasi berhasil
          content:
            application/json:
              example:
                success: true
                message: Registrasi Berhasil
                data: { user_id: 11, name: Candra Test, email: candra@test.com, role: Student, created_at: "2026-09-27T13:00:00.000Z" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              example: { success: false, message: Email sudah terdaftar }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mendapatkan JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: candra@test.com }
                password: { type: string, example: rahasia123 }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              example:
                success: true
                message: Login Berhasil
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user: { user_id: 11, name: Candra Test, email: candra@test.com, role: Student }
        '400':
          description: Email atau password kosong
          content:
            application/json:
              example: { success: false, message: Email dan password wajib diisi }
        '401':
          description: Credential salah
          content:
            application/json:
              example: { success: false, message: Email atau password salah }

  /products:
    get:
      tags: [Products]
      summary: Ambil semua produk (public)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              example:
                success: true
                message: Data Produk Berhasil Diambil
                data:
                  - { id: 1, name: Modul Kurikulum Merdeka, description: Modul ajar SD, price: "75000.00", stock: 20 }
    post:
      tags: [Products]
      summary: Tambah produk (wajib token)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Produk dibuat
          content:
            application/json:
              example:
                success: true
                message: Produk Berhasil Ditambahkan
                data: { id: 1, name: Modul Kurikulum Merdeka, description: Modul ajar SD, price: "75000.00", stock: 20 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Ambil detail produk (public)
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              example:
                success: true
                message: Detail Produk Berhasil Diambil
                data: { id: 1, name: Modul Kurikulum Merdeka, description: Modul ajar SD, price: "75000.00", stock: 20 }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Ubah sebagian data produk (wajib token)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number, minimum: 0, example: 80000 }
                stock: { type: integer, minimum: 0, example: 15 }
      responses:
        '200':
          description: Produk diubah
          content:
            application/json:
              example:
                success: true
                message: Produk Berhasil Diubah
                data: { id: 1, name: Modul Kurikulum Merdeka, description: Modul ajar SD, price: "80000.00", stock: 15 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Hapus produk (wajib token)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Produk dihapus
          content:
            application/json:
              example: { success: true, message: Produk Berhasil Dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }